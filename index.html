<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kostumet Shqiptare</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#17130f;
  color:#f5ead7;
  font-family:Georgia,serif;
}

header{
  text-align:center;
  padding:32px 15px 20px;
  border-bottom:1px solid #80643e;
}

h1{
  font-size:30px;
  margin-bottom:8px;
}

header p{
  font-size:14px;
  opacity:.8;
}

nav{
  display:flex;
  justify-content:center;
  gap:8px;
  padding:15px 8px;
  flex-wrap:wrap;
}

nav button{
  background:#2a2118;
  color:#f5ead7;
  border:1px solid #80643e;
  border-radius:20px;
  padding:9px 14px;
  font-size:13px;
}

.hero{
  min-height:55vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px 20px;
}

.hero-inner{
  max-width:600px;
}

.hero h2{
  font-size:34px;
  margin-bottom:18px;
}

.hero p{
  line-height:1.6;
  opacity:.85;
}

.enter{
  margin-top:25px;
  padding:13px 25px;
  border-radius:25px;
  border:1px solid #b99a67;
  background:#3a2b1d;
  color:white;
  font-size:16px;
}

footer{
  text-align:center;
  padding:20px;
  font-size:12px;
  opacity:.6;
}
</style>
</head>

<body>

<header>
  <h1>Kostumet Tradicionale Shqiptare</h1>
  <p>Atlas digjital i trashëgimisë shqiptare</p>
</header>

<nav>
  <button>Ballina</button>
  <button>Kostumet</button>
  <button>Harta</button>
  <button>3D</button>
  <button>Historia</button>
</nav>

<section class="hero">
  <div class="hero-inner">
    <h2>Trashëgimia që vishet</h2>

    <p>
      Zbulo kostumet tradicionale shqiptare sipas krahinave,
      historisë dhe elementeve të tyre karakteristike.
    </p>

    <button class="enter">Hyr në Atlas</button>
  </div>
</section>

<footer>
  Kostumet Shqiptare • Atlas Digjital
</footer>

</body>
</html>
