name: Nderto APK offline

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Merr projektin
        uses: actions/checkout@v4

      - name: Pergatit Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pergatit Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Krijo projektin Android offline
        env:
          APK_SECRET: ${{ secrets.APK_SECRET }}
          KEYSTORE_ENCRYPTED: ""
        run: |
          test -n "$APK_SECRET" || { echo "Mungon sekreti APK_SECRET"; exit 1; }
          mkdir -p app/src/main/java/al/kostumiim/app
          mkdir -p app/src/main/res/values app/src/main/res/drawable
          mkdir -p app/src/main/assets

          printf '%s' "$KEYSTORE_ENCRYPTED" | base64 -d > kostumi-im.jks.enc
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in kostumi-im.jks.enc -out kostumi-im.jks \
            -pass env:APK_SECRET

          cp index.html app/src/main/assets/index.html
          cp manifest.webmanifest app/src/main/assets/manifest.webmanifest
          cp -r assets app/src/main/assets/assets
          cp assets/icons/icon-512.png app/src/main/res/drawable/app_icon.png

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'KOSTUMI IM'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          def apkSecret = System.getenv('APK_SECRET')

          android {
              namespace 'al.kostumiim.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'al.kostumiim.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }

              signingConfigs {
                  release {
                      storeFile file('../kostumi-im.jks')
                      storePassword apkSecret
                      keyAlias 'kostumiim'
                      keyPassword apkSecret
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@drawable/app_icon"
                  android:label="KOSTUMI IM"
                  android:theme="@style/Theme.KostumiIm"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.KostumiIm" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#8B1530</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/al/kostumiim/app/MainActivity.java <<'EOF'
          package al.kostumiim.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();
                          if ("http".equals(scheme) || "https".equals(scheme)) {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                              return true;
                          }
                          return false;
                      }
                  });

                  if (savedInstanceState == null) {
                      webView.loadUrl("file:///android_asset/index.html");
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onDestroy() {
                  webView.destroy();
                  super.onDestroy();
              }
          }
          EOF

      - name: Nderto APK
        env:
          APK_SECRET: ${{ secrets.APK_SECRET }}
        run: gradle --no-daemon assembleRelease

      - name: Emerto APK
        run: cp app/build/outputs/apk/release/app-release.apk KOSTUMI_IM_OFFLINE_v1.0.0.apk

      - name: Ruaj APK si artifact
        uses: actions/upload-artifact@v4
        with:
          name: KOSTUMI_IM_OFFLINE
          path: KOSTUMI_IM_OFFLINE_v1.0.0.apk

      - name: Publiko ne GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: KOSTUMI IM - Android Offline v1.0.0
          body: "Versioni i pare Android offline i atlasit KOSTUMI IM. Pas instalimit, katalogu dhe fotografite hapen pa internet."
          files: KOSTUMI_IM_OFFLINE_v1.0.0.apk
