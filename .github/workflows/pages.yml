name: Publiko KOSTUMI IM në GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Merr skedarët
        uses: actions/checkout@v4

      - name: Konfiguro GitHub Pages
        uses: actions/configure-pages@v5

      - name: Përgatit faqen
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publiko faqen
        id: deployment
        uses: actions/deploy-pages@v4
